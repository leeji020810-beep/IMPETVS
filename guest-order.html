<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비회원 주문 조회 | IMPETVS</title>
<link rel="icon" href="favicon.ico?v=20261013" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261013">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css?v=20261016w">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="guest-order-root">
  <div class="shp-doc">
    <h1>비회원 주문 조회</h1>
    <div class="shp-banner" id="go-banner" role="status"></div>
    <form class="shp-form" id="go-form" novalidate>
      <label class="shp-field"><span>주문자명</span><input class="shp-in" id="go-name" type="text" autocomplete="off" maxlength="50"></label>
      <label class="shp-field"><span>주문번호</span><input class="shp-in" id="go-no" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40"></label>
      <label class="shp-field"><span>비회원 비밀번호</span><input class="shp-in" id="go-pw" type="password" autocomplete="off" maxlength="64"></label>
      <p class="shp-err" id="go-err" role="alert" hidden></p>
      <button type="submit" class="shp-btn main" id="go-submit" style="margin-top:8px">주문 조회</button>
    </form>
    <div id="go-result" class="shp-hist" hidden></div>
  </div>
</main>
<script src="config.js?v=20261016w"></script>
<script src="shop.js?v=20261016w"></script>
<script src="auth.js?v=20261016w"></script>
<script id="shp-js-guest-order">
(function () {
  var S = window.IMShop, A = window.IMAuth, $ = function (id) { return document.getElementById(id); };
  // The look-up has its OWN switch (guestLookupReady): it never opens orders, payment or social login. The server (guest_order_lookup) checks order-giver name + order number + guest password
  // and limits repeated tries. Nothing typed here is stored in the browser.
  var on = A.guestLookupReady(), STATUS = { pending_payment: '결제 대기', confirming: '결제 확인 중', payment_failed: '결제 실패', paid: '결제 완료', cancelled: '취소됨', shipped: '배송 중', delivered: '배송 완료', refunded: '환불 완료' };
  ['go-name', 'go-no', 'go-pw'].forEach(function (id) { $(id).disabled = !on; });
  $('go-submit').setAttribute('aria-disabled', on ? 'false' : 'true');
  $('go-banner').textContent = on ? '' : '비회원 주문 조회 기능은 준비 중입니다.';
  $('go-banner').hidden = on;
  function err(m) { $('go-err').hidden = false; $('go-err').textContent = m; }
  var busy = false;
  $('go-form').addEventListener('submit', function (e) {
    e.preventDefault(); if (busy) return; $('go-err').hidden = true; $('go-result').hidden = true;
    if (!on) return err('비회원 주문 조회 기능은 준비 중입니다.');
    var nm = $('go-name').value.trim(), no = $('go-no').value.trim(), pw = $('go-pw').value;
    if (!nm || !no || !pw) return err('주문자명, 주문번호, 비회원 비밀번호를 모두 입력해 주세요.');
    busy = true; var b = $('go-submit'); b.disabled = true; b.textContent = '조회 중…';
    A.guestLookup(nm, no, pw).then(function (r) {
      busy = false; b.disabled = false; b.textContent = '주문 조회'; $('go-pw').value = '';
      if (!r.ok) return err(r.limited ? '조회 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.' : r.badInput ? '주문자명, 주문번호, 비회원 비밀번호를 모두 입력해 주세요.' : '주문을 조회하지 못했습니다. ' + A.errorText({ status: r.status, code: r.code }));
      if (!r.found) return err('일치하는 주문을 찾을 수 없습니다. 입력한 정보를 다시 확인해 주세요.');
      var o = r.order, rows = (o.items || []).map(function (i) { return '<li>' + S.esc(i.name) + ' ' + S.esc(i.option) + ' × ' + S.esc(i.qty) + '개 — ' + S.esc(S.money(i.line_total)) + '</li>'; }).join('');
      $('go-result').hidden = false;
      $('go-result').innerHTML = '<h2>주문 내역</h2><p>주문번호 ' + S.esc(o.order_no) + '<br>상태 ' + S.esc(STATUS[o.status] || o.status) + '<br>주문일 ' + S.esc((o.created_at || '').slice(0, 10)) + '</p><ul>' + rows + '</ul><p>상품금액 ' + S.esc(S.money(o.subtotal)) + '<br>배송비 ' + (o.shipping_fee === 0 ? '무료' : S.esc(S.money(o.shipping_fee))) + '<br><b>최종 결제 금액 ' + S.esc(S.money(o.total)) + '</b>' + (o.payment_method ? '<br>결제수단 ' + S.esc(o.payment_method) : '') + (o.refunded_amount > 0 ? '<br>환불 금액 ' + S.esc(S.money(o.refunded_amount)) : '') + (o.test_mode ? '<br><i>테스트 주문입니다. 실제 결제·청구가 없었습니다.</i>' : '') + '</p>';
    });
  });
})();
</script>
</body>
</html>
