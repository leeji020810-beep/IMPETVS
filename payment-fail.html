(function () {
  var q = new URLSearchParams(location.search), code = q.get('code') || '', $ = function (id) { return document.getElementById(id); };
  // our own wording for the codes the Toss docs name; the provider's raw text is not shown
  var M = {
    PAY_PROCESS_CANCELED: '결제를 취소하셨습니다.', PAY_PROCESS_ABORTED: '결제 진행 중 문제가 생겨 결제가 완료되지 않았습니다.',

  $('pf-banner').textContent = M[code] || '결제를 완료하지 못했습니다. 다시 시도해 주세요.';
  if (code && !M[code]) $('pf-detail').textContent = '오류 코드: ' + code.replace(/[^A-Za-z0-9_]/g, '').slice(0, 60);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
})();
</script>
