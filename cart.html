<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장바구니 | IMPETVS</title>
<link rel="icon" href="favicon.ico?v=20261013" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261013">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css?v=20261016l">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="cart-root">
  <div class="shp-cartpg">
    <h1>장바구니</h1>
    <div id="cart-body"></div>
  </div>
</main>
<script src="config.js?v=20261016l"></script>
<script src="shop.js?v=20261016l"></script>
<script src="auth.js?v=20261016l"></script>
<script id="shp-js-cart">
(function () {
  var S = window.IMShop, body = document.getElementById('cart-body');
  // 상품금액 / 배송비 / 최종 합계 are shown separately; the shipping fee follows the product subtotal (free from 50,000원)
  function sumHTML() {
    var sub = S.cart.total(), fee = S.shipping.calc(sub), ok = typeof sub === 'number' && fee !== null;
    return '<div class="shp-osum shp-cartsum">' +
      '<div class="shp-orow"><span>상품금액 합계 <span class="muted">(총 ' + S.cart.count() + '개)</span></span><b id="cart-sub">' + S.esc(S.money(sub)) + '</b></div>' +
      '<div class="shp-orow"><span>배송비</span><span id="cart-ship">' + (ok ? (fee === 0 ? '무료' : S.esc(S.money(fee))) : '-') + '</span></div>' +
      '<div class="shp-orow t"><span>최종 합계</span><b id="cart-total">' + (ok ? S.esc(S.money(sub + fee)) : '-') + '</b></div></div>';
  }
  // 같은 상품은 용량과 관계없이 합계 최대 30개: over = the cart already holds more (older cart) -> the visitor must reduce it
  function limitHTML(list) {
    var over = S.cart.overLimit(list), full = list.some(function (i) { return S.cart.totalOf(i.id) >= S.cart.maxQty(i.id); });
    if (over.length) return '<p class="shp-notice" id="cart-limit-note" role="alert">' + S.esc(S.QTY_MSG) + ' 지금 장바구니에는 ' + over[0].total + '개가 담겨 있습니다. ' + (over[0].total - over[0].max) + '개 이상 줄여야 주문할 수 있습니다.</p>';
    return full ? '<p class="shp-notice" id="cart-limit-note" role="status">' + S.esc(S.QTY_MSG) + '</p>' : '';
  }
  function render() {
    var list = S.cart.items();
    if (!list.length) {
      body.innerHTML = '<div class="shp-cart-empty"><p>장바구니가 비어 있습니다.</p></div><div class="shp-cart-go"><a class="shp-btn" href="' + S.links.product + '">상품 보러 가기</a></div>';
      return;
    }
    var rows = list.map(function (it, i) {
      var p = S.products[it.id];
      return '<li class="shp-item" data-i="' + i + '">' +
        '<a href="' + S.links.product + '" aria-label="' + S.esc(p.name) + ' 상품 보기"><img src="' + S.esc(S.img(S.imgFor(it.id, it.option))) + '" width="96" height="128" alt="' + S.esc(p.name + ' ' + it.option) + '"></a>' +
        '<div><p class="shp-item-name">' + S.esc(p.name) + '</p>' +
        '<p class="shp-item-opt">용량: ' + S.esc(it.option) + '</p>' +
        '<p class="shp-item-unit">단가 ' + S.esc(S.money(S.cart.unit(it))) + '</p>' +
        '<p class="shp-item-amt">합계 ' + S.esc(S.money(S.cart.line(it))) + '</p></div>' +
        '<div class="shp-item-side"><div class="shp-qty" role="group" aria-label="' + S.esc(p.name + ' ' + it.option) + ' 수량">' +
        '<button type="button" data-act="minus" aria-label="수량 줄이기"' + (it.qty <= 1 ? ' disabled' : '') + '>−</button>' +
        '<input type="number" data-act="qty" value="' + it.qty + '" min="1" max="' + S.cart.maxQty(it.id) + '" inputmode="numeric" aria-label="수량">' +
        '<button type="button" data-act="plus" aria-label="수량 늘리기"' + (S.cart.totalOf(it.id) >= S.cart.maxQty(it.id) ? ' disabled' : '') + '>+</button></div>' +
        '<button type="button" class="shp-rm" data-act="rm" aria-label="' + S.esc(p.name + ' ' + it.option) + ' 삭제">삭제</button></div></li>';
    }).join('');
    body.innerHTML = limitHTML(list) + '<ul class="shp-list">' + rows + '</ul>' +
      sumHTML() +
      '<p class="shp-shipnote shp-cartnote">' + S.shipping.cartNote.map(S.esc).join('<br>') + '</p>' +
      '<p class="shp-notice" id="cart-pay-note" role="status" hidden>' + S.PAY_NOT_READY + ' 담아 두신 상품은 그대로 유지됩니다.</p>' +
      '<a class="shp-btn" id="cart-order" href="' + S.links.order + '">주문하기</a>';
  }
  function refocus(i, act) {
    var el = body.querySelector('.shp-item[data-i="' + i + '"] [data-act="' + act + '"]') || body.querySelector('.shp-item [data-act], a.shp-btn');
    if (el && el.focus) el.focus();
  }
  // 주문하기: the whole cart (product / capacity / quantity) goes to the order page; nothing is removed from the cart here
  body.addEventListener('click', function (e) {
    if (e.target.closest('#cart-order')) {
      if (S.cart.overLimit().length) { e.preventDefault(); S.toast(S.QTY_MSG + ' 수량을 줄여 주세요.'); var ln = document.getElementById('cart-limit-note'); if (ln) ln.scrollIntoView({ block: 'center' }); return; }   // an over-limit cart is never sent to the order page
      if (!S.paymentReady()) { e.preventDefault(); var n = document.getElementById('cart-pay-note'); if (n) n.hidden = false; S.toast(S.PAY_NOT_READY); return; }   // nothing is started while payment is not connected
      S.order.fromCart(); return;
    }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var i = +b.closest('.shp-item').dataset.i, it = S.cart.items()[i]; if (!it) return;
    if (b.dataset.act === 'minus') S.cart.setQty(i, it.qty - 1);
    else if (b.dataset.act === 'plus') S.cart.setQty(i, it.qty + 1);
    else if (b.dataset.act === 'rm') S.cart.remove(i);
    else return;
    render(); refocus(i, b.dataset.act);
  });
  body.addEventListener('change', function (e) {
    if (e.target.dataset.act !== 'qty') return;
    S.cart.setQty(+e.target.closest('.shp-item').dataset.i, Number(e.target.value)); render();
  });
  S.subscribe(function () { if (!body.contains(document.activeElement) || document.activeElement === document.body) render(); });
  render();
})();
</script>
</body>
</html>
