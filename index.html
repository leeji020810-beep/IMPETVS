<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

const IMGS = [['p00','스톤 · 기울어진 바틀'],['p01','쇼핑백 · 패키지'],['p02','프로스티드 · 빛'],['p03','스톤 · 다크'],['p04','플루티드 글라스'],['p05','프로스티드 B'],['p06','데스크 · 수트'],['p07','프로스티드 A'],['p08','절벽 · 화이트'],['p09','스모크'],['p10','차량 · 매거진'],['p11','페이퍼 · 로고'],['p12','분사'],['p13','패키지 박스'],['p14','스톤 · 웜'],['p15','시트러스'],['p16','포토 프린트'],['p17','마블 · 프레임'],['p18','박스 · 오픈'],['p19','박스 · 화이트'],['p20','추가 이미지'],['p21','노트 TOP'],['p22','노트 MIDDLE'],['p23','노트 BASE'],['p24','프레즌스'],['p25','히어로'],['p26','히어로 가로'],['p27','사용법'],['p28','사용법 B'],['p29','룩북 2'],['p30','룩북 3'],['p31','룩북 4'],['p32','룩북 5'],['p33','노트 MIDDLE (신규)'],['p34','노트 BASE (신규)']].map(([value,label])=>({value,label:value.slice(1)+' '+label}));
const PANELS = [['global','전체 스타일'],['motion','모션'],['nav','내비 · 버튼'],['hero','01 히어로'],['story','02 스토리 · 04 무드 · 띠'],['notes','03 노트 · 아코디언'],['kp','05 키포인트'],['care','06 피부 테스트 · 07 리뷰'],['pres','08 프레즌스 · 09 사용법'],['tail','10 룩북 · 정보 · 푸터']].map(([value,label])=>({value,label}));

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const S = k => v => setTweak(k, v);
  useScrollFX(t.motion);
  useReveal(t.motion + t.revLayout + t.lookCount + t.storyFill);
  const active = useActiveSection();
  const cls = ['pr', t.display === 'serif' && 'gx-serif', t.gxCase === 'none' && 'gx-lower', t.motion === 'rich' && 'm-rich', t.motion !== 'off' && 'm-on', t.grain && 'grain', t.sideIndex && 'gut', t.imgTone !== 'original' && 'tone-' + t.imgTone].filter(Boolean).join(' ');
  const vars = {
    '--mq-dur': t.mqSpeed + 's', '--acc': t.accent === 'blue' ? 'var(--primary-normal-3)' : '#fff', '--gxls': t.gxTrack + 'em', '--krw': t.krWeight, '--bs': t.bodyScale,
    '--rad': t.radius + 'px', '--sp-y': t.secSpace + 'px', '--grain-o': t.grainAmt / 100, '--rv-y': t.rvY + 'px', '--rv-d': t.rvDur + 's', '--logo': t.logoSize + 'px',
    '--hd': t.heroDim, '--hw': t.heroWordSize, '--hz': t.heroZoom, '--ss': t.storySize, '--bt': t.bandTilt, '--ag': t.accGrow, '--ah': t.accHeight, '--agap': t.accGap + 'px', '--adim': t.accDim,
    '--dsz': t.discSize, '--db': t.discBlur + 'px', '--kph': t.kpLen,
  };
  const P = t.panel;
  const R = (label, k, opts) => <TweakRadio label={label} value={t[k]} options={opts.map(o => Array.isArray(o) ? { value: o[0], label: o[1] } : o)} onChange={S(k)} />;
  const Sl = (label, k, min, max, step, unit) => <TweakSlider label={label} value={t[k]} min={min} max={max} step={step} unit={unit} onChange={S(k)} />;
  const Tg = (label, k) => <TweakToggle label={label} value={t[k]} onChange={S(k)} />;
  const Im = (label, k) => <TweakSelect label={label} value={t[k]} options={IMGS} onChange={S(k)} />;
  return (
    <div className={cls} style={vars}>
      <PNav t={t} />
      {t.sideIndex && <PIndex active={active} t={t} />}
      <PHero t={t} /><PStory t={t} /><PBand t={t} /><PNotes t={t} /><PMood t={t} /><PKeyPoint t={t} /><PCare t={t} /><PReview t={t} /><PPresence t={t} /><PHow t={t} /><PLook t={t} /><PInfo t={t} /><PFoot t={t} />
      {t.floatBuy && <div className={`pbuy ${active === 'intro' ? 'hide' : ''}`}><PBtn t={t} size="md" /></div>}
      <EventPopup href="event.html" />
      <TweaksPanel>
        <TweakSelect label="편집할 영역" value={P} options={PANELS} onChange={S('panel')} />
        {P === 'global' && <>
          <TweakSection label="타이포그래피" />
          {R('대형 영문 서체', 'display', [['sans', 'Grotesk'], ['serif', 'Gloock']])}
          {Sl('대형 영문 자간', 'gxTrack', -0.08, 0.04, 0.005, 'em')}
          {R('대형 영문 대소문자', 'gxCase', [['upper', 'UPPER'], ['none', 'Original']])}
          {R('한글 헤드라인 굵기', 'krWeight', [[500, 'Medium'], [600, 'SemiBold'], [700, 'Bold']])}
          {Sl('본문 크기', 'bodyScale', 0.85, 1.25, 0.05, '×')}
          <TweakSection label="컬러 · 이미지" />
          {R('포인트 컬러', 'accent', [['mono', '모노'], ['blue', 'Wanted Blue']])}
          {R('이미지 톤', 'imgTone', [['original', '원본'], ['mono', '흑백'], ['contrast', '고대비']])}
          {Tg('필름 그레인', 'grain')}
          {t.grain && Sl('그레인 강도', 'grainAmt', 2, 30, 1, '%')}
          <TweakSection label="레이아웃" />
          {Sl('모서리 반경', 'radius', 0, 32, 2, 'px')}
          {Sl('섹션 상하 여백', 'secSpace', 64, 240, 8, 'px')}
        </>}
        {P === 'motion' && <>
          {R('모션 수준', 'motion', [['off', '없음'], ['subtle', '은은'], ['rich', '풍부']])}
          {Sl('등장 거리', 'rvY', 0, 120, 4, 'px')}
          {Sl('등장 속도', 'rvDur', 0.3, 2, 0.1, 's')}
          {Sl('마퀴 1회 시간', 'mqSpeed', 8, 60, 1, 's')}
          {Sl('히어로 줌 강도', 'heroZoom', 0, 0.4, 0.02, '')}
          {Tg('스토리 단어 채움', 'storyFill')}
          {Tg('푸터 글자 상승', 'footRise')}
        </>}
        {P === 'nav' && <>
          <TweakSection label="상단 내비" />
          {R('스타일', 'navStyle', [['blend', '블렌드'], ['solid', '솔리드']])}
          {Tg('링크 표시', 'navLinks')}
          {Sl('로고 크기', 'logoSize', 16, 40, 1, 'px')}
          <TweakSection label="사이드 인덱스" />
          {Tg('사이드 인덱스', 'sideIndex')}
          {t.sideIndex && R('라벨 표시', 'idxLabel', [['active', '현재만'], ['all', '전체'], ['hover', '호버 시']])}
          <TweakSection label="버튼" />
          {R('모양', 'btnShape', [['pill', '알약형'], ['rect', '각진']])}
          {R('스타일', 'btnStyle', [['solid', '채움'], ['outline', '라인']])}
          {Tg('플로팅 구매 버튼', 'floatBuy')}
        </>}
        {P === 'hero' && <>
          {Im('이미지', 'heroImg')}
          {Sl('이미지 세로 위치', 'heroPosY', 0, 100, 1, '%')}
          {Sl('어둡기', 'heroDim', 0, 2, 0.1, '×')}
          {R('대형 워드', 'heroWord', [['impetvs', 'IMPETVS'], ['richman', 'RICH MAN']])}
          {R('워드 위치', 'heroWordPos', [['bottom', '하단'], ['center', '중앙'], ['none', '숨김']])}
          {Sl('워드 크기', 'heroWordSize', 10, 26, 0.2, 'vw')}
          {Tg('상단 메타 정보', 'heroMeta')}
          {Tg('구매 버튼', 'heroCta')}
        </>}
        {P === 'story' && <>
          <TweakSection label="스토리" />
          {R('배경', 'storyBg', [['dark', '블랙'], ['lite', '화이트']])}
          {Sl('글자 크기', 'storySize', 0.7, 1.3, 0.05, '×')}
          {Tg('섹션 라벨 (스토리 · 무드)', 'storyLabel')}
          <TweakSection label="마퀴 띠" />
          {Sl('기울기', 'bandTilt', 0, 10, 0.5, '°')}
          {R('띠 색', 'bandColor', [['white', '화이트'], ['black', '블랙']])}
          {R('줄 수', 'bandRows', [[1, '1줄'], [2, '2줄']])}
        </>}
        {P === 'notes' && <>
          <TweakSection label="아코디언 (노트 · 룩북 공통)" />
          {R('펼침 방식', 'accTrigger', [['hover', '호버'], ['click', '클릭']])}
          {Sl('펼친 패널 비율', 'accGrow', 2, 9, 0.2, '×')}
          {Sl('높이', 'accHeight', 50, 100, 2, 'svh')}
          {Sl('패널 간격', 'accGap', 0, 24, 1, 'px')}
          {Sl('접힌 패널 밝기', 'accDim', 0.2, 1, 0.02, '')}
          {Tg('세로 라벨', 'accVert')}
          {Tg('번호 표시', 'accIndex')}
          <TweakSection label="노트" />
          {R('노트 목록', 'noteList', [['row', '가로'], ['col', '세로']])}
          {Im('TOP 이미지', 'noteTop')}
          {Im('MIDDLE 이미지', 'noteMid')}
          {Im('BASE 이미지', 'noteBase')}
        </>}
        {P === 'kp' && <>
          {R('이미지 위치', 'kpSide', [['left', '왼쪽'], ['right', '오른쪽']])}
          {R('숫자 서체', 'kpNum', [['serif', 'Gloock'], ['sans', 'Grotesk']])}
          {Sl('스크롤 길이', 'kpLen', 200, 500, 10, 'svh')}
          {Tg('진행 바', 'kpBar')}
          {Im('01 이미지', 'kpImg1')}
          {Im('02 이미지', 'kpImg2')}
          {Im('03 이미지', 'kpImg3')}
        </>}
        {P === 'care' && <>
          <TweakSection label="피부 테스트" />
          {R('배경', 'careBg', [['alt', '그레이'], ['lite', '화이트'], ['dark', '블랙']])}
          {R('제목 정렬', 'careAlign', [['center', '가운데'], ['left', '왼쪽']])}
          {Tg('번호 표시', 'careNum')}
          <TweakSection label="리뷰" />
          {R('레이아웃', 'revLayout', [['rows', '행'], ['cards', '카드']])}
          {Tg('호버 반전', 'revHover')}
        </>}
        {P === 'pres' && <>
          <TweakSection label="프레즌스" />
          {R('이미지 위치', 'presSide', [['left', '왼쪽'], ['right', '오른쪽']])}
          {Im('이미지', 'presImg')}
          <TweakSection label="사용법" />
          {Im('배경 이미지', 'howImg')}
          {Tg('HOW TO USE 대형 워드', 'howWord')}
          {R('카드 위치', 'howPos', [['br', '우하단'], ['bl', '좌하단'], ['ct', '중앙']])}
          {R('카드 스타일', 'howCard', [['glass', '글래스'], ['solid', '화이트']])}
        </>}
        {P === 'tail' && <>
          <TweakSection label="룩북" />
          {R('이미지 수', 'lookCount', [[4, '4장'], [5, '5장'], [6, '6장']])}
          <TweakSection label="상품 정보" />
          {R('배경', 'infoBg', [['lite', '화이트'], ['alt', '그레이']])}
          {R('레이아웃', 'infoLayout', [['split', '좌우'], ['stack', '세로']])}
          <TweakSection label="푸터" />
          {R('대형 워드', 'footWord', [['impetvs', 'IMPETVS'], ['richman', 'RICH MAN']])}
          {Tg('회사 정보 영역', 'footMeta')}
        </>}
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
