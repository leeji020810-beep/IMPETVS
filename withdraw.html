<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원탈퇴 | IMPETVS</title>
<link rel="icon" href="favicon.ico?v=20261013" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261013">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css?v=20261017f">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="withdraw-root">
  <div class="shp-doc">
    <h1>회원탈퇴</h1>
    <p class="shp-banner" id="wd-login" role="status" hidden>로그인 후 이용할 수 있습니다. <a href="login.html" id="wd-go" style="text-decoration:underline">로그인하기</a></p>
    <p class="shp-err" id="wd-err" role="alert" hidden></p>
    <p class="shp-okmsg" id="wd-ok" role="status" hidden>회원탈퇴가 완료되었습니다.</p>
    <p><button type="button" class="shp-btn main" id="wd-btn" style="max-width:360px;margin:0 auto">회원탈퇴</button></p>
  </div>
</main>
<script src="config.js?v=20261017f"></script>
<script src="shop.js?v=20261017f"></script>
<script src="auth.js?v=20261017f"></script>
<script id="shp-js-withdraw">
(function () {
  var S = window.IMShop, A = window.IMAuth, $ = function (id) { return document.getElementById(id); }, busy = false, dlg = null;
  var MSG = '탈퇴하면 계정과 삭제 대상 게시물을 복구할 수 없습니다. 탈퇴하시겠습니까?';
  function err(m) { $('wd-err').hidden = false; $('wd-err').textContent = m; }
  function setup() {
    var on = A.backendReady() && A.loggedIn();
    $('wd-btn').hidden = !on; $('wd-login').hidden = on;
    if (!A.backendReady()) { $('wd-login').hidden = false; $('wd-login').textContent = '회원 서비스 연결 전입니다.'; }
  }
  $('wd-go').addEventListener('click', function () { A.needLogin(S.links.withdraw); });

  // ---- the confirmation window. NOTHING is sent to the server when it opens, when the visitor cancels, presses Esc or clicks outside: only "탈퇴하기" starts the request.
  function closeDlg(restore) {
    if (!dlg) return; var d = dlg; dlg = null; document.removeEventListener('keydown', d.onKey, true); d.ov.remove(); document.documentElement.classList.remove('shp-dlg-lock');
    if (restore !== false) $('wd-btn').focus();
  }
  function openDlg() {
    if (busy || dlg) return;
    var ov = document.createElement('div'); ov.className = 'shp-dlg-ov';
    ov.innerHTML = '<div class="shp-dlg" role="alertdialog" aria-modal="true" aria-labelledby="wd-dlg-t" aria-describedby="wd-dlg-d" tabindex="-1"><p id="wd-dlg-t" class="shp-dlg-t">회원탈퇴</p><p id="wd-dlg-d" class="shp-dlg-d"></p>' +
      '<div class="shp-dlg-a"><button type="button" class="shp-btn line" data-cancel>취소</button><button type="button" class="shp-btn main" data-ok>탈퇴하기</button></div></div>';
    ov.querySelector('#wd-dlg-d').textContent = MSG;
    document.body.appendChild(ov); document.documentElement.classList.add('shp-dlg-lock');
    var box = ov.querySelector('.shp-dlg'), cancel = ov.querySelector('[data-cancel]'), ok = ov.querySelector('[data-ok]');
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (!busy) closeDlg(); return; }
      if (e.key === 'Tab') { var it = [cancel, ok].filter(function (b) { return !b.disabled; }); if (!it.length) { e.preventDefault(); return; } var i = it.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); it[it.length - 1].focus(); } else if (!e.shiftKey && (i === it.length - 1 || i < 0)) { e.preventDefault(); it[0].focus(); } }
    }
    dlg = { ov: ov, onKey: onKey }; document.addEventListener('keydown', onKey, true);
    ov.addEventListener('mousedown', function (e) { if (e.target === ov && !busy) closeDlg(); });   // click outside = cancel
    cancel.addEventListener('click', function () { if (!busy) closeDlg(); });
    ok.addEventListener('click', function () { withdraw(ok, cancel); });
    cancel.focus();                                                                                    // the safe choice has the focus: Enter / Space cancels
  }
  // ---- the ONE place that talks to the server. The SERVER (delete_my_account) takes the member from the verified login token: no e-mail and no member id are sent.
  // "완료" is shown only when the server answers deleted = true.
  function withdraw(ok, cancel) {
    if (busy) return; busy = true; ok.disabled = true; cancel.disabled = true; ok.textContent = '처리 중…'; $('wd-btn').disabled = true; $('wd-err').hidden = true; $('wd-ok').hidden = true;
    A.rpc('delete_my_account').then(function (r) {
      if (!r.ok || !r.data || r.data.deleted !== true) {
        busy = false; $('wd-btn').disabled = false; closeDlg(); var m = String(r.message || '');
        return err(m === 'ADMIN_ACCOUNT' ? '관리자 계정은 탈퇴할 수 없습니다.' : (r.status === 401 || r.code === 'not_logged_in' || m === 'LOGIN_REQUIRED') ? '로그인이 만료되었습니다. 다시 로그인해 주세요.' : '회원탈퇴를 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      }
      closeDlg(false); A.clearSession();                    // the account is gone: remove the tokens and every login trace from this browser
      $('wd-btn').hidden = true; $('wd-ok').hidden = false;
      setTimeout(function () { location.href = S.links.home; }, 1500);
    });
  }
  $('wd-btn').addEventListener('click', openDlg);          // the page button only OPENS the question
  A.onChange(function () { if (!busy) setup(); }); setup();
})();
</script>
</body></html>
