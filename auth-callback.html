<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 처리 | IMPETVS</title>
<link rel="icon" href="favicon.ico?v=20261013" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261013">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css?v=20261017f">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="cb-root">
  <div class="shp-auth">
    <h1 id="cb-h">로그인 처리</h1>
    <div class="shp-form">
      <p class="shp-note" id="cb-msg" role="status">로그인 정보를 확인하고 있습니다…</p>
      <p class="shp-err" id="cb-err" role="alert" hidden></p>
      <div class="shp-links" id="cb-back" hidden><a href="login.html">로그인 화면으로 돌아가기</a></div>
    </div>

    <!-- 소셜 로그인 후 가입 완료 폼: 약관 동의와 필수 정보는 여기서 본인이 직접 입력·체크합니다. 자동으로 동의 처리하지 않습니다. -->
    <form class="shp-form" id="cb-form" novalidate hidden>
      <p class="shp-notice" id="cb-intro" style="margin:0 0 24px">처음 이용하시는 계정입니다. 아래 정보를 입력하고 약관에 동의하면 가입이 완료됩니다.</p>
      <label class="shp-field"><span>이름</span><input class="shp-in" type="text" id="cb-name" autocomplete="name" maxlength="50"></label>
      <label class="shp-field"><span>휴대폰 번호</span><input class="shp-in" type="tel" id="cb-phone" autocomplete="tel" inputmode="numeric" placeholder="숫자만 입력"></label>
      <label class="shp-field" id="cb-email-wrap" hidden><span>이메일 <small style="font-weight:400;color:rgba(55,56,60,.61)">(소셜 계정에서 이메일을 받지 못했습니다)</small></span><input class="shp-in" type="email" id="cb-email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></label>
      <label class="shp-chk su-all"><input type="checkbox" id="cb-all"><span><b>모든 약관 동의에 동의합니다.</b></span></label>
      <label class="shp-chk"><input type="checkbox" id="cb-c0"><span>[필수] 만 14세 이상입니다.</span></label>
      <label class="shp-chk"><input type="checkbox" id="cb-c1"><span>[필수] <a href="terms.html" target="_blank" rel="noopener">이용약관</a>에 동의합니다.</span></label>
      <label class="shp-chk"><input type="checkbox" id="cb-c2"><span>[필수] <a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a>에 동의합니다.</span></label>
      <p class="shp-err" id="cb-ferr" role="alert" hidden></p>
      <button type="submit" class="shp-btn main" id="cb-submit" style="margin-top:12px">가입 완료</button>
      <button type="button" class="shp-btn line" id="cb-cancel" style="margin-top:8px">취소</button>
    </form>
  </div>
</main>
<script src="config.js?v=20261017f"></script>
<script src="shop.js?v=20261017f"></script>
<script src="auth.js?v=20261017f"></script>
<script id="shp-js-callback">
/* Callback for Kakao (Supabase puts the tokens in the URL fragment), Naver (?code&state -> naver-login Edge Function) and the e-mail confirmation links.
   A login is shown as successful only after the server really returned a session. A NEW social account is finished on the form below: nothing is consented to automatically. */
(function () {
  var A = window.IMAuth, S = window.IMShop, $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), h = location.hash;
  function fail(m) { $('cb-msg').hidden = true; $('cb-form').hidden = true; $('cb-err').hidden = false; $('cb-err').textContent = m; $('cb-back').hidden = false; }
  function info(m) { $('cb-msg').hidden = false; $('cb-msg').textContent = m; $('cb-back').hidden = false; }
  function done() { $('cb-msg').hidden = false; $('cb-msg').textContent = '로그인되었습니다. 이동합니다…'; var n = A.takeNext(); location.replace(n || S.links.home); }
  history.replaceState(null, '', location.pathname + (q.get('resume') ? '?resume=1' : ''));
  if (!A.backendReady()) return fail('회원 서비스 연결 전입니다.');

  /* ---------- the sign-up form (consents + required data) */
  var mode = null, pending = null, needEmail = false, busy = false;
  var items = ['cb-c0', 'cb-c1', 'cb-c2'];
  function syncAll() { var k = items.filter(function (id) { return $(id).checked; }).length, all = $('cb-all'); all.checked = k === 3; all.indeterminate = k > 0 && k < 3; }
  $('cb-all').addEventListener('change', function () { items.forEach(function (id) { $(id).checked = $('cb-all').checked; }); syncAll(); });
  items.forEach(function (id) { $(id).addEventListener('change', syncAll); });
  function ferr(m) { $('cb-ferr').hidden = false; $('cb-ferr').textContent = m; }
  function showForm(o) {
    mode = o.mode; pending = o.pending || null; needEmail = !!o.needEmail;
    $('cb-msg').hidden = true; $('cb-err').hidden = true; $('cb-form').hidden = false; $('cb-h').textContent = '회원가입 완료';
    $('cb-name').value = o.name || ''; $('cb-email-wrap').hidden = !needEmail;
    $('cb-name').focus();
  }
  $('cb-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('cb-ferr').hidden = true; if (busy) return;
    var name = $('cb-name').value.trim(), phoneRaw = $('cb-phone').value.trim(), phone = A.normPhone(phoneRaw), mail = A.normEmail($('cb-email').value);
    if (!$('cb-c0').checked) return ferr('만 14세 이상만 가입할 수 있습니다. ‘만 14세 이상입니다’를 확인해 주세요.');
    if (!name) return ferr('이름을 입력해 주세요.');
    if (!phoneRaw) return ferr('휴대폰 번호를 입력해 주세요.');
    if (!phone) return ferr('휴대폰 번호 형식이 올바르지 않습니다. 예: 010-1234-5678');
    if (needEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return ferr('연락 받을 이메일 주소를 정확히 입력해 주세요.');
    if (!$('cb-c1').checked || !$('cb-c2').checked) return ferr('필수 약관에 모두 동의해 주세요.');
    var f = { name: name, phone: phone, age14: $('cb-c0').checked, terms: $('cb-c1').checked, privacy: $('cb-c2').checked, contactEmail: needEmail ? mail : null };
    var b = $('cb-submit'); busy = true; b.disabled = true; b.textContent = '처리 중…';
    (mode === 'naver' ? A.completeNaver(pending, f) : A.completeSocial(f)).then(function (r) {
      busy = false; b.disabled = false; b.textContent = '가입 완료';
      if (r.ok) return done();
      ferr(r.message || '가입을 완료하지 못했습니다.');
    });
  });
  $('cb-cancel').addEventListener('click', function () {
    if (busy) return; busy = true;
    // Kakao: the unfinished account is removed on the server and this browser signs out. Naver: nothing exists yet.
    (mode === 'naver' ? Promise.resolve() : A.cancelSocial()).then(function () { location.replace(S.links.login); });
  });

  // after a Kakao session exists: is the sign-up finished? an account that was silently attached to an existing e-mail account is refused
  function afterSession() {
    A.signupState().then(function (st) {
      if (!st) { return A.signOut().then(function () { fail('회원 정보를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.'); }); }
      if (st.linked_email_account) return A.signOut().then(function () { fail('이미 같은 이메일로 가입된 계정이 있습니다. 가입한 방법(이메일·비밀번호)으로 로그인해 주세요.'); });
      if (!st.complete) return showForm({ mode: 'kakao', name: st.name || '', needEmail: !st.has_email });
      done();
    });
  }

  var hp = A.parseHash(h) || {};
  if (hp.message && !hp.access_token) return info(hp.message);   // e.g. the first step of an e-mail change: "proceed to the link sent to the other address"
  if (h && /access_token|error/.test(h)) {
    var r = A.finishFromHash(h);
    if (!r.ok) {
      var d = String(hp.error_description || ''), c = String(hp.error_code || '');
      if (hp.error === 'access_denied' && c !== 'otp_expired') return fail('로그인을 취소하셨습니다. 필요하시면 다시 시도해 주세요.');
      if (/email/i.test(d) && /(getting|provider|required)/i.test(d)) return fail('소셜 계정에서 이메일 정보를 받지 못했습니다. 제공 정보에 이메일을 포함하거나 이메일로 가입해 주세요.');
      if (/database error|saving|link/i.test(d)) return fail('이미 같은 이메일로 가입된 계정이 있을 수 있습니다. 가입한 방법(이메일·비밀번호)으로 로그인해 주세요.');
      return fail(A.errorText({ status: 400, code: c, message: d || r.message }));
    }
    if (hp.type === 'signup' || hp.type === 'email_change' || hp.type === 'invite' || hp.type === 'magiclink') return done();   // the e-mail confirmation links (not a social login): the account was made by the e-mail form, with its consents
    return afterSession();
  }
  if (q.get('error')) return fail(q.get('error') === 'access_denied' ? '로그인을 취소하셨습니다. 필요하시면 다시 시도해 주세요.' : '소셜 로그인이 취소되었거나 실패했습니다.');
  if (q.get('code')) return A.finishNaver(q.get('code'), q.get('state')).then(function (r) {
    if (!r.ok) return fail(r.message);
    if (r.signup) return showForm({ mode: 'naver', pending: r.pending, name: r.name, needEmail: false });
    done();
  });
  if (q.get('resume') && A.loggedIn()) return afterSession();
  fail('로그인 정보를 받지 못했습니다. 처음부터 다시 시도해 주세요.');
})();
</script>
</body>
</html>
