<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>새 비밀번호 설정 | IMPETVS</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="reset-root">
  <div class="shp-auth">
    <h1>새 비밀번호 설정</h1>
    <form class="shp-form" id="np-form" novalidate>
      <p class="shp-note" id="np-note" role="status" style="margin:0 0 20px"></p>
      <input class="shp-in" type="password" id="np-pw" autocomplete="new-password" placeholder="새 비밀번호 (8자 이상)" aria-label="새 비밀번호">
      <input class="shp-in" type="password" id="np-pw2" autocomplete="new-password" placeholder="새 비밀번호 확인" aria-label="새 비밀번호 확인">
      <p class="shp-err" id="np-err" role="alert" hidden></p>
      <p class="shp-okmsg" id="np-ok" role="status" hidden></p>
      <button type="submit" class="shp-btn main" id="np-submit">비밀번호 변경</button>
      <div class="shp-links"><a href="login.html">로그인으로 이동</a><i aria-hidden="true"></i><a href="login.html" data-resend>재설정 메일 다시 받기</a></div>
    </form>
  </div>
</main>
<script src="config.js"></script>
<script src="shop.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var A = window.IMAuth, $ = function (id) { return document.getElementById(id); };
  // the reset mail's link brings a one-time recovery token in the URL fragment; it is only used for this one request
  var p = A.parseHash(location.hash), tok = p.type === 'recovery' ? p.access_token : null;
  history.replaceState(null, '', location.pathname + location.search); // take the token out of the address bar
  function err(m) { $('np-err').hidden = false; $('np-err').textContent = m; }
  if (!A.backendReady()) { $('np-note').textContent = '회원 서비스 연결 전입니다.'; $('np-pw').disabled = $('np-pw2').disabled = true; }
  else if (!tok) { $('np-note').textContent = '유효한 재설정 링크가 아닙니다. 로그인 화면에서 비밀번호 재설정 메일을 다시 요청해 주세요.'; $('np-pw').disabled = $('np-pw2').disabled = true; }
  else $('np-note').textContent = '새로 사용할 비밀번호를 입력해 주세요.';
  $('np-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('np-err').hidden = true; $('np-ok').hidden = true;
    if (!A.backendReady() || !tok) return err($('np-note').textContent);
    var pw = $('np-pw').value; if (pw.length < 8) return err('비밀번호는 8자 이상이어야 합니다.'); if (pw !== $('np-pw2').value) return err('비밀번호 확인이 일치하지 않습니다.');
    var b = $('np-submit'); b.disabled = true; b.textContent = '처리 중…';
    A.updatePassword(tok, pw).then(function (r) {
      b.disabled = false; b.textContent = '비밀번호 변경';
      if (!r.ok) return err(r.message);
      $('np-pw').value = $('np-pw2').value = ''; $('np-ok').hidden = false; $('np-ok').textContent = '비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.'; tok = null;
    });
  });
})();
</script>
</body>
</html>
