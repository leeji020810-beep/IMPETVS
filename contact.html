<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1:1 문의하기 | IMPETVS</title>
<link rel="icon" href="favicon.ico?v=20261013" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261013">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css?v=20261016h">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="contact-root">
  <div class="shp-doc">
    <h1>1:1 문의하기</h1>
    <div class="shp-banner" id="ct-banner" role="status"></div>
    <form class="shp-form" id="ct-form" novalidate hidden>
      <label class="shp-field"><span>문의 유형</span>
        <select class="shp-in" id="ct-type">
          <option value="">선택해 주세요</option><option>상품·향 문의</option><option>주문·결제</option><option>배송</option><option>교환·반품</option><option>회원 서비스</option><option>기타</option>
        </select></label>
      <label class="shp-field"><span>제목</span><input class="shp-in" id="ct-title" type="text" maxlength="100"></label>
      <label class="shp-field"><span>내용</span><textarea class="shp-in shp-ta" id="ct-body" rows="7" maxlength="3000"></textarea></label>
      <p class="shp-note" style="margin:0 0 12px;font-size:13px">보관 기준(IMPETVS 운영 기준): 단순 상품·이용 안내 문의는 답변 완료 후 90일 이내에 삭제합니다. 소비자 불만·분쟁 처리에 해당하는 문의는 처리 완료일부터 3년, 거래·청약철회 기록에 해당하는 부분은 법정 보존기간 동안 보관합니다. 문의에 불필요한 개인정보(주민등록번호, 비밀번호 등)는 적지 마세요.</p>
      <p class="shp-err" id="ct-err" role="alert" hidden></p>
      <button type="submit" class="shp-btn main" id="ct-submit">문의 접수</button>
    </form>
    <section class="shp-hist" id="ct-hist" hidden><h2 id="ct-hist-h">내 문의와 답변</h2><div id="ct-list"></div></section>
  </div>
</main>
<script src="config.js?v=20261016h"></script>
<script src="shop.js?v=20261016h"></script>
<script src="auth.js?v=20261016h"></script>
<script id="shp-js-contact">
(function () {
  var S = window.IMShop, A = window.IMAuth, $ = function (id) { return document.getElementById(id); };
  var form = $('ct-form'), banner = $('ct-banner'), TEL = ' 고객센터 0507-1372-9152로 문의해 주세요.', isAdmin = false;
  var fmt = function (iso) { var d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); };
  var KINDS = [['guidance', '단순 상품·이용 안내 (답변 후 90일 보관)'], ['complaint', '소비자 불만·분쟁 (처리 후 3년 보관)'], ['transaction', '거래·청약철회 관련 (5년 보관)']];
  function err(m) { $('ct-err').hidden = false; $('ct-err').textContent = m; }
  function loadList() {
    $('ct-hist').hidden = false; $('ct-hist-h').textContent = isAdmin ? '접수된 문의 (관리자)' : '내 문의와 답변'; $('ct-list').innerHTML = '<p class="shp-empty">불러오는 중…</p>';
    // the SERVER decides who sees what (row-level security): a member gets only their own inquiries, the administrator gets all of them
    A.rest.select('service_inquiries', 'select=id,user_id,type,title,content,status,kind,answer,answered_at,created_at&order=created_at.desc&limit=50', true).then(function (r) {
      if (!r.ok) { $('ct-list').innerHTML = '<p class="shp-empty">문의 내역을 불러오지 못했습니다. <button type="button" class="shp-lk2" id="ct-retry">다시 시도</button></p>'; $('ct-retry').onclick = loadList; return; }
      var rows = r.data || [];
      if (!isAdmin) return paint(rows, {});
      var ids = rows.map(function (q) { return q.user_id; }).filter(function (v, k, a) { return v && a.indexOf(v) === k; });
      if (!ids.length) return paint(rows, {});
      A.rest.select('profiles', 'select=id,name&id=in.(' + ids.map(encodeURIComponent).join(',') + ')', true).then(function (p) { var m = {}; (p.data || []).forEach(function (x) { m[x.id] = x.name; }); paint(rows, m); });
    });
  }
  function paint(rows, names) {
    $('ct-list').innerHTML = rows.length ? rows.map(function (q) {
      var who = isAdmin ? '<p class="shp-rv-r">작성자: ' + S.esc(q.user_id ? (names[q.user_id] || '회원') : '탈퇴한 회원') + '</p>' : '';
      var ans = q.answer ? '<div class="shp-ans"><b>답변</b><p>' + S.esc(q.answer) + '</p></div>' : '';
      var adm = isAdmin ? '<form class="shp-form ct-ans" data-id="' + S.esc(q.id) + '" novalidate style="margin-top:12px">' +
        '<label class="shp-field"><span>답변</span><textarea class="shp-in shp-ta" rows="4" maxlength="3000" data-f="answer">' + S.esc(q.answer || '') + '</textarea></label>' +
        '<label class="shp-field"><span>분류 (보관 기간이 달라집니다)</span><select class="shp-in" data-f="kind"><option value="">선택해 주세요</option>' + KINDS.map(function (k) { return '<option value="' + k[0] + '"' + (q.kind === k[0] ? ' selected' : '') + '>' + S.esc(k[1]) + '</option>'; }).join('') + '</select></label>' +
        '<p class="shp-err" data-e role="alert" hidden></p><button type="submit" class="shp-btn sm">' + (q.answer ? '답변 수정' : '답변 등록') + '</button></form>' : '';
      return '<article class="shp-rv"><div class="shp-rv-h"><b>[' + S.esc(q.type) + '] ' + S.esc(q.title) + '</b><span>' + S.esc(fmt(q.created_at)) + '</span></div>' + who + '<p class="shp-rv-r">' + (q.answer ? '답변 완료' : '접수됨') + '</p><p class="shp-rv-t">' + S.esc(q.content) + '</p>' + ans + adm + '</article>';
    }).join('') : '<p class="shp-empty">' + (isAdmin ? '접수된 문의가 없습니다.' : '접수한 문의가 없습니다.') + '</p>';
  }
  // administrator: save an answer. Success is shown only if the server really changed exactly this row.
  $('ct-list').addEventListener('submit', function (e) {
    var f = e.target.closest('.ct-ans'); if (!f) return; e.preventDefault();
    var ans = f.querySelector('[data-f=answer]').value.trim(), kind = f.querySelector('[data-f=kind]').value, er = f.querySelector('[data-e]'), btn = f.querySelector('button'); er.hidden = true;
    if (!ans) { er.hidden = false; er.textContent = '답변 내용을 입력해 주세요.'; return; }
    if (!kind) { er.hidden = false; er.textContent = '분류를 선택해 주세요. 분류에 따라 보관·삭제 기간이 정해집니다.'; return; }
    btn.disabled = true;
    A.rest.update('service_inquiries', 'id=eq.' + encodeURIComponent(f.dataset.id), { answer: ans, kind: kind }).then(function (r) {
      btn.disabled = false;
      if (!r.ok || !r.data || r.data.length !== 1) { er.hidden = false; er.textContent = '답변을 저장하지 못했습니다. ' + (r.ok ? '관리자 권한을 확인해 주세요.' : A.errorText(r)) + ' (입력한 내용은 그대로 남아 있습니다.)'; return; }
      S.toast('답변을 저장했습니다.'); loadList();
    });
  });
  function setup() {
    if (!A.backendReady()) { banner.textContent = '1:1 문의 접수 기능은 준비 중입니다. 문의 저장 서비스가 연결되기 전에는 접수할 수 없습니다.' + TEL; form.hidden = true; return; }
    if (!A.inquiryReady()) { banner.textContent = '1:1 문의 접수는 아직 열려 있지 않습니다.' + TEL; form.hidden = true; return; }
    if (!A.loggedIn()) { banner.innerHTML = '1:1 문의는 로그인 후 접수할 수 있습니다. <a href="' + S.esc(S.links.login) + '" id="ct-login" style="text-decoration:underline">로그인하기</a>'; form.hidden = true; $('ct-hist').hidden = true; return; }
    banner.textContent = '접수하신 문의는 로그인한 계정으로 저장되며, 본인과 관리자만 확인할 수 있습니다. 답변은 이 페이지의 ‘내 문의와 답변’에서 확인할 수 있습니다(답변 알림 메일은 보내지 않습니다).'; form.hidden = false;
    A.isAdmin().then(function (a) { isAdmin = !!a; loadList(); });
  }
  document.addEventListener('click', function (e) { if (e.target.closest('#ct-login')) A.needLogin(S.links.contact); });
  form.addEventListener('submit', function (e) {
    e.preventDefault(); $('ct-err').hidden = true;
    var t = $('ct-type').value, ti = $('ct-title').value.trim(), c = $('ct-body').value.trim();
    if (!t) return err('문의 유형을 선택해 주세요.'); if (!ti) return err('제목을 입력해 주세요.'); if (c.length < 5) return err('내용을 5자 이상 적어 주세요.');
    var b = $('ct-submit'); b.disabled = true; b.textContent = '접수 중…';
    // owner / status come from the server (login token + database); "접수됨" is shown only after the server returned the saved row
    A.rest.insert('service_inquiries', { type: t, title: ti, content: c }).then(function (r) {
      b.disabled = false; b.textContent = '문의 접수';
      if (!r.ok || !r.data || !r.data[0] || !r.data[0].id) return err('문의를 접수하지 못했습니다. ' + (r.ok ? '저장 결과를 확인하지 못했습니다. ' : A.errorText(r)) + ' (작성한 내용은 그대로 남아 있습니다.)');
      $('ct-type').value = ''; $('ct-title').value = ''; $('ct-body').value = ''; S.toast('문의가 접수되었습니다.'); loadList();
    });
  });
  A.onChange(setup); setup();
})();
</script>
</body>
</html>
