<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 | IMPETVS</title>
<link rel="icon" href="favicon.ico?v=20261013" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261013">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-beb8d14c-f6b2-4c59-bddd-968280ae75bb/tokens/semantic.css">
<link rel="stylesheet" href="shop.css?v=20261017g">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<div data-shp-header></div>
<main class="shp-page" id="login-root">
  <div class="shp-auth">
    <!-- ① 로그인 -->
    <section data-mode="login" aria-labelledby="lg-h">
      <h1 id="lg-h">로그인</h1>
      <form class="shp-form" id="lg-form" novalidate>
        <input class="shp-in" type="email" id="lg-id" autocomplete="username" placeholder="아이디(이메일)" aria-label="아이디(이메일)">
        <input class="shp-in" type="password" id="lg-pw" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
        <label class="shp-chk shp-auto"><input type="checkbox" id="lg-auto"><span>자동 로그인</span></label>
        <button type="submit" class="shp-btn main" id="lg-submit">로그인</button>
        <div class="shp-links shp-links3">
          <button type="button" class="shp-lk" data-go="find">ID/PW 찾기</button><i aria-hidden="true"></i>
          <a href="signup.html">회원가입</a><i aria-hidden="true"></i>
          <a href="guest-order.html">비회원 주문조회</a>
        </div>
        <p class="shp-err" id="lg-err" role="alert" hidden></p>
        <p class="shp-note" id="lg-note" role="status"></p>
        <div class="shp-social">
          <button type="button" class="shp-sbtn kakao" id="lg-kakao">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7l-1 3.6c-.1.3.2.5.5.4l4.2-2.8c.5.1 1.1.1 1.7.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>카카오 로그인/회원가입
          </button>
          <button type="button" class="shp-sbtn naver" id="lg-naver">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M14.9 12.7 8.8 4H4v16h5.1v-8.7L15.2 20H20V4h-5.1z"/></svg>네이버 로그인/회원가입
          </button>
        </div>
      </form>
    </section>

    <!-- ② ID/PW 찾기 (centred, short): tabs 아이디 찾기 / 비밀번호 찾기, 인증방법 = 이메일 / 휴대폰 번호, one wide 확인 button.
         The log-in ID IS the e-mail address. Nothing about an account is shown before the address is proven by the e-mail link. The phone method is NOT connected: its inputs and request are switched off. -->
    <section data-mode="find" aria-labelledby="fd-h" hidden>
      <h1 id="fd-h">ID/PW 찾기</h1>
      <div class="fd-tabs" role="tablist" aria-label="찾기 종류">
        <button type="button" role="tab" id="tab-id" aria-selected="true" aria-controls="pn-id" data-tab="id">아이디 찾기</button>
        <button type="button" role="tab" id="tab-pw" aria-selected="false" aria-controls="pn-pw" data-tab="pw" tabindex="-1">비밀번호 찾기</button>
      </div>

      <div id="pn-id" role="tabpanel" aria-labelledby="tab-id">
        <div class="fd-meth" role="radiogroup" aria-label="인증방법"><span class="fd-ml" aria-hidden="true">인증방법</span><div class="fd-rd">
          <label><input type="radio" name="idm" value="email" checked><span>이메일</span></label>
          <label><input type="radio" name="idm" value="phone"><span>휴대폰 번호</span></label>
        </div></div>
        <form class="shp-form" id="fi-mail" novalidate data-m="email">
          <input class="shp-in" type="text" id="fm-name" autocomplete="name" placeholder="이름" aria-label="이름">
          <input class="shp-in" type="email" id="fm-email" autocomplete="email" placeholder="가입한 이메일" aria-label="가입한 이메일">
          <p class="shp-err" id="fm-err" role="alert" hidden></p>
          <p class="shp-okmsg" id="fm-ok" role="status" hidden></p>
          <button type="submit" class="shp-btn main" id="fm-send">확인</button>
        </form>
        <form class="shp-form" id="fi-form" novalidate data-m="phone" hidden>
          <input class="shp-in" type="text" id="fi-name" autocomplete="name" placeholder="이름" aria-label="이름">
          <input class="shp-in" type="tel" id="fi-phone" autocomplete="tel" placeholder="휴대폰 번호 (숫자만)" aria-label="휴대폰 번호" inputmode="numeric">
          <div id="fi-step2" hidden>
            <input class="shp-in" type="text" id="fi-code" autocomplete="one-time-code" placeholder="인증번호 6자리" aria-label="인증번호" inputmode="numeric" maxlength="6">
            <button type="submit" class="shp-btn main" id="fi-verify">확인</button>
          </div>
          <p class="shp-err" id="fi-err" role="alert" hidden></p>
          <p class="shp-okmsg" id="fi-result" role="status" hidden></p>
          <p class="shp-note" id="fi-note" role="status"></p>
          <button type="button" class="shp-btn main" id="fi-send">확인</button>
        </form>
      </div>

      <div id="pn-pw" role="tabpanel" aria-labelledby="tab-pw" hidden>
        <div class="fd-meth" role="radiogroup" aria-label="인증방법"><span class="fd-ml" aria-hidden="true">인증방법</span><div class="fd-rd">
          <label><input type="radio" name="pwm" value="email" checked><span>이메일</span></label>
          <label><input type="radio" name="pwm" value="phone"><span>휴대폰 번호</span></label>
        </div></div>
        <form class="shp-form" id="rs-form" novalidate data-m="email">
          <input class="shp-in" type="email" id="rs-email" autocomplete="email" placeholder="아이디(가입한 이메일)" aria-label="아이디(가입한 이메일)">
          <p class="shp-err" id="rs-err" role="alert" hidden></p>
          <p class="shp-okmsg" id="rs-ok" role="status" hidden></p>
          <p class="shp-note" id="rs-note" role="status"></p>
          <button type="submit" class="shp-btn main" id="rs-submit">확인</button>
        </form>
        <form class="shp-form" id="rp-form" novalidate data-m="phone" hidden>
          <input class="shp-in" type="email" id="rp-id" autocomplete="username" placeholder="아이디(가입한 이메일)" aria-label="아이디(가입한 이메일)">
          <input class="shp-in" type="text" id="rp-name" autocomplete="name" placeholder="이름" aria-label="이름">
          <input class="shp-in" type="tel" id="rp-phone" autocomplete="tel" placeholder="휴대폰 번호 (숫자만)" aria-label="휴대폰 번호" inputmode="numeric">
          <p class="shp-err" id="rp-err" role="alert" hidden></p>
          <p class="shp-note" id="rp-note" role="status"></p>
          <button type="button" class="shp-btn main" id="rp-send">확인</button>
        </form>
      </div>
      <div class="shp-links"><button type="button" class="shp-lk" data-go="login">로그인으로 돌아가기</button></div>
    </section>
  </div>
</main>
<script src="config.js?v=20261017g"></script>
<script src="shop.js?v=20261017g"></script>
<script src="auth.js?v=20261017g"></script>
<script id="shp-js-login">
(function () {
  var root = document.getElementById('login-root'), S = window.IMShop, A = window.IMAuth, C = A.cfg;
  var $ = function (id) { return document.getElementById(id); };
  var OFF = '회원 서비스 연결 전입니다. 서버(Supabase) 설정이 끝나면 이용할 수 있습니다.';
  var SMS_OFF = '휴대폰 인증은 준비 중입니다.';

  function show(mode) {
    [].forEach.call(root.querySelectorAll('[data-mode]'), function (s) { s.hidden = s.getAttribute('data-mode') !== mode; });
    var h = root.querySelector('[data-mode="' + mode + '"] h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  [].forEach.call(root.querySelectorAll('[data-go]'), function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-go')); }); });
  function err(el, msg) { el.hidden = false; el.textContent = msg; }
  function busy(btn, on, label) { btn.disabled = on; btn.textContent = on ? '처리 중…' : label; }

  // what is switched off right now, and why (nothing is faked as "working")
  var ready = A.backendReady();
  [$('lg-id'), $('lg-pw'), $('fm-name'), $('fm-email'), $('rs-email')].forEach(function (i) { i.disabled = !ready; });
  $('lg-note').textContent = ready ? '' : OFF + ' 비밀번호 등 개인정보를 이 브라우저에 저장하지 않습니다.';
  $('rs-note').textContent = ready ? '' : OFF;
  if (!ready) { $('lg-submit').setAttribute('aria-disabled', 'true'); }
  // phone verification is not connected: its inputs and request stay switched off and say so (no fake code, no fake success)
  var smsOn = ready && !!(C.sms && C.sms.enabled);
  [$('fi-name'), $('fi-phone'), $('rp-id'), $('rp-name'), $('rp-phone')].forEach(function (i) { i.disabled = !smsOn; });
  [$('fi-send'), $('rp-send')].forEach(function (b) { b.setAttribute('aria-disabled', smsOn ? 'false' : 'true'); b.classList.toggle('is-off', !smsOn); });   // clickable on purpose: it answers '준비 중' instead of doing nothing
  $('fi-note').textContent = !ready ? OFF : (smsOn ? '' : SMS_OFF);
  $('rp-note').textContent = !ready ? OFF : (smsOn ? '' : SMS_OFF);

  function afterLogin() { var n = A.takeNext(); location.href = n || S.links.home; }

  // ① login. 자동 로그인 (default OFF): ticked -> the tokens stay in this browser (localStorage); not ticked -> only this tab / window (sessionStorage). The password is never stored.
  $('lg-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('lg-err').hidden = true;
    if (!ready) { err($('lg-err'), OFF); return; }
    var em = $('lg-id').value.trim(), pw = $('lg-pw').value;
    if (!em || !pw) return err($('lg-err'), '이메일과 비밀번호를 입력해 주세요.');
    busy($('lg-submit'), true, '로그인');
    A.signIn(em, pw, $('lg-auto').checked).then(function (r) {
      busy($('lg-submit'), false, '로그인');
      if (r.ok) { $('lg-pw').value = ''; afterLogin(); } else { $('lg-pw').value = ''; err($('lg-err'), r.message); }
    });
  });
  // Kakao / Naver: their own switch (socialLoginReady), independent of legalReady and of payment. The consents are NOT asked here: the person ticks them on the sign-up form after the login.
  var SOC_OFF = ' 로그인/회원가입은 준비 중입니다. (앱 등록과 인증 키 설정이 필요합니다.)';
  function social(btn, name, enabled, run) {
    btn.addEventListener('click', function () {
      $('lg-err').hidden = true;
      if (!ready) return err($('lg-err'), OFF);
      if (!enabled() || !A.socialReady()) return err($('lg-err'), name + SOC_OFF);
      run();
    });
  }
  social($('lg-kakao'), '카카오', function () { return !!(C.kakao && C.kakao.enabled); }, function () { if (!A.startKakao()) err($('lg-err'), '카카오 로그인을 시작하지 못했습니다.'); });
  social($('lg-naver'), '네이버', function () { return !!(C.naver && C.naver.enabled); }, function () {
    var b = $('lg-naver'); b.disabled = true;
    A.startNaver().then(function (r) { if (!r.ok) { b.disabled = false; err($('lg-err'), r.message || '네이버 로그인을 시작하지 못했습니다.'); } });
  });

  // ② tabs + method switch
  function tab(which) {
    ['id', 'pw'].forEach(function (k) { var on = k === which; $('tab-' + k).setAttribute('aria-selected', on ? 'true' : 'false'); $('tab-' + k).tabIndex = on ? 0 : -1; $('pn-' + k).hidden = !on; });
  }
  [].forEach.call(root.querySelectorAll('[data-tab]'), function (b) {
    b.addEventListener('click', function () { tab(b.getAttribute('data-tab')); });
    b.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var o = b.getAttribute('data-tab') === 'id' ? 'pw' : 'id'; tab(o); $('tab-' + o).focus(); } });
  });
  function method(group, formsByM) { [].forEach.call(root.querySelectorAll('input[name="' + group + '"]'), function (r) { r.addEventListener('change', function () { if (!r.checked) return; Object.keys(formsByM).forEach(function (m) { $(formsByM[m]).hidden = m !== r.value; }); }); }); }
  method('idm', { email: 'fi-mail', phone: 'fi-form' }); method('pwm', { email: 'rs-form', phone: 'rp-form' });

  // a short pause between mail requests from this browser (the mail service has its own server-side limit as well)
  // the same short answer for every address (nothing about an account is shown). Only a request was made: the person is NOT verified until the link in the e-mail is opened.
  var SENT = '메일의 링크로 본인 확인을 완료해 주세요.';
  var COOL = 60000, lastMail = 0;
  function cooling(btn, label) { var left = COOL - (Date.now() - lastMail); if (left <= 0) return false; btn.textContent = Math.ceil(left / 1000) + '초 뒤 다시 요청할 수 있습니다'; setTimeout(function () { btn.textContent = label; }, Math.min(left, 3000)); return true; }
  function mailRequest(em, btn, label, errEl, okEl, okText) {
    errEl.hidden = true; okEl.hidden = true;
    if (!ready) return err(errEl, OFF);
    if (!/^\S+@\S+\.\S+$/.test(em)) return err(errEl, '이메일 주소를 정확히 입력해 주세요.');
    if (cooling(btn, label)) return;
    busy(btn, true, label);
    A.resetRequest(em).then(function (r) {   // the answer is the same whether or not the address has an account
      busy(btn, false, label);
      if (!r.ok) return err(errEl, r.message);
      lastMail = Date.now(); okEl.hidden = false; okEl.textContent = okText;
    });
  }
  // 아이디 찾기 (e-mail): the ID is the e-mail, so this is "confirm / recover the account of THIS address". Nothing is shown before the address is proven by the link.
  $('fi-mail').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!$('fm-name').value.trim()) { $('fm-ok').hidden = true; return err($('fm-err'), '이름을 입력해 주세요.'); }
    mailRequest($('fm-email').value.trim(), $('fm-send'), '확인', $('fm-err'), $('fm-ok'), SENT);
  });
  // 비밀번호 찾기 (e-mail): same safe flow, ends in the normal "set a new password" page
  $('rs-form').addEventListener('submit', function (e) {
    e.preventDefault();
    mailRequest($('rs-email').value.trim(), $('rs-submit'), '확인', $('rs-err'), $('rs-ok'), SENT);
  });
  // phone methods: switched off until a real SMS / identity service is connected
  $('rp-send').addEventListener('click', function () { err($('rp-err'), ready ? SMS_OFF : OFF); });
  $('fi-send').addEventListener('click', function () {
    $('fi-err').hidden = true; $('fi-result').hidden = true;
    if (!smsOn) return err($('fi-err'), ready ? SMS_OFF : OFF);
    var n = $('fi-name').value.trim(), p = $('fi-phone').value.replace(/\D/g, '');
    if (!n || p.length < 10) return err($('fi-err'), '이름과 휴대폰 번호를 정확히 입력해 주세요.');
    busy($('fi-send'), true, '확인');
    A.findIdSend(n, p).then(function (r) {
      busy($('fi-send'), false, '확인');
      if (!r.ok) return err($('fi-err'), r.message);
      $('fi-step2').hidden = false; $('fi-note').textContent = '문자로 받은 인증번호를 입력해 주세요. 입력하신 정보가 가입 정보와 일치할 때만 문자가 발송됩니다.'; $('fi-code').focus();
    });
  });
  $('fi-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('fi-err').hidden = true;
    if (!smsOn) return err($('fi-err'), ready ? SMS_OFF : OFF);
    var code = $('fi-code').value.trim(); if (!/^\d{6}$/.test(code)) return err($('fi-err'), '인증번호 6자리를 입력해 주세요.');
    busy($('fi-verify'), true, '확인');
    A.findIdVerify($('fi-name').value.trim(), $('fi-phone').value.replace(/\D/g, ''), code).then(function (r) {
      busy($('fi-verify'), false, '확인');
      if (!r.ok) return err($('fi-err'), r.message);
      $('fi-result').hidden = false; $('fi-result').textContent = '가입하신 아이디(이메일)는 ' + r.masked + ' 입니다.';
    });
  });

  if (A.loggedIn()) $('lg-note').textContent = '이미 로그인되어 있습니다. 상단의 사람 아이콘에서 MY PAGE으로 이동할 수 있습니다.';
})();
</script>
</body>
</html>
